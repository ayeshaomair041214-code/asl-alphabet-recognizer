<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASL Alphabet Recognizer</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f1ff;color:#25213a;text-align:center;padding:20px}
main{max-width:500px;margin:auto;background:white;padding:22px;border-radius:20px}
button{background:#6845c5;color:white;border:0;border-radius:12px;padding:14px 22px;font-size:16px}
#camera{margin:16px auto;max-width:320px}#camera canvas{width:100%!important;height:auto!important}
#letter{font-size:56px;color:#6845c5;font-weight:bold}
</style>
</head>
<body><main>
<h1>ASL Alphabet Recognizer</h1>
<p>Show one trained hand sign clearly to the camera.</p>
<button id="start" onclick="startCamera()">START CAMERA</button>
<div id="camera"></div>
<p>Recognized letter</p><div id="letter">-</div><div id="confidence"></div>
<p id="status">Press START CAMERA to begin.</p>
</main>
<script>
const URL="https://teachablemachine.withgoogle.com/models/8TsdPBMwl/";
let model,webcam,running=false;
async function startCamera(){
 const b=document.getElementById("start"),s=document.getElementById("status");
 b.disabled=true;s.textContent="Loading model and camera...";
 try{
  if(!model)model=await tmImage.load(URL+"model.json",URL+"metadata.json");
  if(!webcam){webcam=new tmImage.Webcam(320,320,true);await webcam.setup();await webcam.play();document.getElementById("camera").appendChild(webcam.canvas);}
  running=true;b.textContent="CAMERA RUNNING";s.textContent="Show a hand sign!";
  requestAnimationFrame(loop);
 }catch(e){console.error(e);s.textContent="Camera could not start. Allow camera access and use an HTTPS webpage.";b.disabled=false;b.textContent="TRY AGAIN";}
}
async function loop(){if(!running)return;webcam.update();await predict();requestAnimationFrame(loop);}
async function predict(){
 const p=await model.predict(webcam.canvas);p.sort((a,b)=>b.probability-a.probability);
 const best=p[0];document.getElementById("letter").textContent=best.className;
 document.getElementById("confidence").textContent=Math.round(best.probability*100)+"% confidence";
 if(window.AppInventor&&window.AppInventor.setWebViewString)window.AppInventor.setWebViewString(best.className);
}
</script></main></body></html>
